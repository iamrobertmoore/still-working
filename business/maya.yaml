# Maya's shop, in Maya's words.
#
# This file is the whole difference between a tool for developers and a product for a
# business owner. Everything above the line in each routine is how Maya describes her
# own business. Everything below it was worked out by the agent during setup and she
# has never read it.
#
# She did not write any of the vendor call names. She could not. She answered five
# questions about what happens in her week, and the setup conversation turned those
# answers into calls to watch. That mapping is recorded here so it can be checked,
# corrected, and blamed when it is wrong.

owner: Maya
business: A twelve-person online shop. Homeware, mostly. Sells online and at one counter.
who_fixes_things: Priya, a freelance developer, two days a month, not on retainer
how_maya_finds_out_today: Someone tells her. Usually a customer, sometimes her bookkeeper.

routines:

  - id: orders-into-accounts
    what_maya_calls_it: Orders going into the accounts
    in_her_words: >
      Every night the day's orders are supposed to turn up in my accounting software so
      Ines can reconcile them in the morning. I do not look at it. It either happened or
      Ines tells me it did not.
    how_often: every night
    if_it_stops: >
      Ines reconciles from this. Nothing looks wrong on my side, the shop keeps taking
      orders, the money still arrives. The gap only shows up when someone adds it up.
    how_late_would_she_notice: three weeks, that is what happened last time
    what_it_costs: >
      Three weeks of manual reconciliation for Ines, at her hourly rate, plus a VAT return
      built on numbers nobody trusts.
    # ---- derived by the agent during setup, 2026-08-25. Maya has not read this part. ----
    derived:
      confidence: high
      why: >
        She named the accounting software and said orders move nightly. A nightly push of
        orders into Xero can only be reading orders from the till and writing invoices or
        payments into the accounts.
      depends_on:
        - vendor: square
          calls: ["GET /v2/orders", "POST /v2/orders/search", "GET /v2/locations"]
        - vendor: xero
          calls: ["POST /Invoices", "PUT /Invoices", "POST /Payments", "GET /Contacts"]

  - id: taking-payment
    what_maya_calls_it: Taking payment
    in_her_words: >
      People pay on the website with a card. If that stops I know within about four minutes
      because the orders stop and someone emails me.
    how_often: continuously
    if_it_stops: obvious and immediate
    how_late_would_she_notice: minutes
    what_it_costs: every hour of downtime is a day of trading in December
    derived:
      confidence: high
      why: Card payments on the website, she names Stripe on her invoices.
      depends_on:
        - vendor: stripe
          calls: ["POST /v1/payment_intents", "POST /v1/charges", "GET /v1/payment_intents/{intent}"]

  - id: refunding-someone
    what_maya_calls_it: Refunding someone
    in_her_words: >
      Returns come back, my team refunds them from the admin screen. It is fiddly already.
    how_often: ten or twenty a week
    if_it_stops: >
      The team cannot refund. They will do it by bank transfer instead and not tell me, and
      then the accounts will not match.
    how_late_would_she_notice: a week, when the accounts stop matching
    what_it_costs: chargebacks, and a customer who was already annoyed
    derived:
      confidence: medium
      why: >
        She said "from the admin screen", which is her own admin, not Stripe's dashboard.
        That means her code calls the refund endpoint. Medium because she may be refunding
        through Square for counter sales too and did not mention it.
      depends_on:
        - vendor: stripe
          calls: ["POST /v1/refunds", "GET /v1/refunds/{refund}"]

  - id: labels-and-tracking
    what_maya_calls_it: Getting parcels out and telling people where they are
    in_her_words: >
      We print labels in the morning. The tracking number goes into the email the customer
      gets. If the tracking is wrong they email us and we lose an hour.
    how_often: every weekday morning
    if_it_stops: labels still print, tracking emails go out wrong or empty
    how_late_would_she_notice: two days, when the emails start coming in
    what_it_costs: an hour a day of someone answering "where is my parcel"
    derived:
      confidence: medium
      why: >
        Label printing plus a tracking number written back into her email template. Medium
        because she did not say who sends the email, so the tracking read may be hers or
        her email provider's.
      depends_on:
        - vendor: shipengine
          calls: ["POST /v1/labels", "GET /v1/labels", "GET /v1/labels/{label_id}",
                  "GET /v1/tracking", "POST /v1/rates"]

  - id: monday-figure
    what_maya_calls_it: The Monday morning number
    in_her_words: >
      I look at last week's sales on Monday. It is one number. If it is wrong I will make a
      decision on it and not know I did.
    how_often: weekly
    if_it_stops: >
      The worst one. It does not stop, it just quietly becomes wrong, and she acts on it.
    how_late_would_she_notice: possibly never
    what_it_costs: unknowable, which is the problem
    derived:
      confidence: low
      why: >
        She did not say where the number comes from. It could be Square's own reporting,
        in which case nothing here touches it, or a spreadsheet her developer built that
        totals the week's payments. Low confidence is recorded rather than guessed. The
        agent should ask her again.
        NOTE, 25 Aug: this routine originally listed only calls that
        orders-into-accounts also uses. A routine whose calls are a strict subset of a
        more confident routine's can never trigger its own confirmation, because the
        confident one always answers first. Caught by a test that could not be made to
        fail. GET /v2/payments is the call the weekly total would plausibly use on its
        own, and it is the one that makes this routine independently observable.
      depends_on:
        - vendor: square
          calls: ["POST /v2/orders/search", "GET /v2/locations", "GET /v2/payments"]

  # ------------------------------------------------------------------------------
  # Added 2 September 2026. See the note at the bottom of this file: the first five
  # routines were written by hand as a stand-in for a setup conversation, and five
  # months of measurement showed they were too thin to ever fire. These three are what
  # a real setup conversation would have got out of her. Each lists the calls a working
  # integration uses, not the calls that happened to break.
  # ------------------------------------------------------------------------------

  - id: stock-between-counter-and-website
    what_maya_calls_it: Stock moving between the counter and the website
    in_her_words: >
      Everything is in one pile. If someone buys the last lamp in the shop the website
      has to know within the hour or I sell it twice and have to write to somebody and
      apologise. It goes the other way too when we move a pallet up from the unit.
    how_often: continuously, and a bigger move most Mondays
    if_it_stops: >
      Nothing looks wrong. The website keeps selling. I find out when two people have
      bought the same thing.
    how_late_would_she_notice: a few days, when the second customer complains
    what_it_costs: >
      A refund, an apology, and a review. In December it is worse because the counter is
      busy and nobody is watching the numbers.
    derived:
      confidence: high
      why: >
        She sells the same stock through two channels and said it is one pile. That is a
        stock count read and written on both sides, plus the transfers when a pallet moves.
      depends_on:
        - vendor: square
          calls: ["GET /v2/inventory/counts", "POST /v2/inventory/counts/batch-retrieve",
                  "POST /v2/inventory/changes/batch-create", "GET /v2/inventory/transfers/{transfer_id}",
                  "POST /v2/inventory/transfers", "POST /v2/catalog/batch-upsert"]

  - id: paying-the-team
    what_maya_calls_it: Paying the twelve of us
    in_her_words: >
      People are on the books. Hours go in, expenses go in, and it has to be right because
      it is people's wages.
    how_often: monthly, and expenses whenever somebody buys something
    if_it_stops: somebody is not paid, or is paid the wrong amount
    how_late_would_she_notice: immediately, because a person tells her
    what_it_costs: the one on this list she cannot absorb quietly
    derived:
      confidence: medium
      why: >
        She has twelve people on the books and uses this accounting software for them.
        Medium and not high because the accounting product and the payroll product are
        different things at this vendor, and she did not say which one she is on. If she
        is on the separate payroll product then nothing watched here touches her wages
        and this routine is watching the wrong thing. The agent should ask.
      depends_on:
        - vendor: xero
          calls: ["GET /Employees", "GET /Employees/{EmployeeID}", "POST /Employees",
                  "PUT /Employees", "GET /ExpenseClaims"]

  - id: bank-matching-the-books
    what_maya_calls_it: The bank matching the books
    in_her_words: >
      Ines matches what actually landed in the bank against what the system thinks. That
      is most of what she does on a Friday.
    how_often: weekly, and hard at quarter end
    if_it_stops: >
      The matching stops finding things and Ines does it by hand, which is slow rather
      than impossible, so she may not mention it for a while.
    how_late_would_she_notice: two or three weeks, when Ines has had enough
    what_it_costs: Ines's Fridays, and a VAT return that takes twice as long
    derived:
      confidence: high
      why: >
        Bank reconciliation against the accounts. She named the person and the day.
      depends_on:
        - vendor: xero
          calls: ["GET /BankTransactions", "POST /BankTransactions", "GET /BankTransfers",
                  "POST /BankTransfers", "GET /Accounts"]

# What Maya is never shown unless it reaches her:
#   - the word endpoint
#   - the word parameter
#   - the name of any vendor's API
#   - a diff
#
# ------------------------------------------------------------------------------------
# NOTE, 2 September 2026, and this belongs in the write-up.
#
# The first five routines were written by hand as a stand-in for a setup conversation
# that does not exist yet. Reconstructing five months of real contract history and
# replaying it through them returned zero: not one of the nine breaking changes across
# four vendors touched anything Maya was watching.
#
# That was not the vendors being stable. It was a profile too thin to fire. The churn in
# those five months was concentrated in stock, in employees, and in bank reconciliation,
# and a twelve-person shop that sells through a counter and a website plainly does all
# three. I had given her five routines. A shop that size has nine or ten.
#
# Two smaller misses in the same direction: she watched POST /v1/labels but not GET, so
# a real change to reading a label back went past her; and the transfers endpoint that
# was removed is one any two-channel stock sync reads.
#
# The routines above were widened with the full call set a working integration uses, not
# with the calls that happened to break, which is the difference between correcting an
# under-specification and fitting the profile to the answer. The measurement was re-run
# afterwards and whatever it says is what goes in the write-up.
#
# The real lesson is about the product rather than the profile: a hand-written profile is
# the weakest part of this system, and the setup conversation that replaces it is
# therefore the most valuable thing left to build.
# ------------------------------------------------------------------------------------
