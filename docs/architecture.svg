<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" role="img" aria-labelledby="title desc">
<title id="title">Still Working: from supplier publication to an owner's note</title><desc id="desc">GitHub Actions collects and matches public contracts, invokes Strands on Bedrock AgentCore through OIDC, persists approved notes and the delivery ledger, then publishes GitHub Pages. Maya is illustrative.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#77927d"/></marker></defs>
<rect width="1180" height="760" rx="18" fill="#f7f8f2"/><path d="M18 0H1162Q1180 0 1180 18V103H0V18Q0 0 18 0" fill="#15251f"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#243d33">
<text x="44" y="52" font-family="Georgia,serif" font-size="32" fill="#c0d6a7">still working.</text><text x="44" y="82" font-size="14" fill="#a1b0a4">Collect the change. Understand the routine. Deliver the next step.</text>
<g fill="#fffefa" stroke="#dfe5db"><rect x="44" y="122" width="322" height="208" rx="14"/><rect x="428" y="122" width="322" height="208" rx="14"/><rect x="812" y="122" width="324" height="208" rx="14"/></g>
<text x="66" y="153" font-size="11" fill="#657269" letter-spacing="2">01 / COLLECT</text><text x="66" y="187" font-size="21">What changed?</text><text x="66" y="221" font-size="14">Stripe · Square · Xero · ShipEngine</text><text x="66" y="248" font-size="13">Fetch and compare public contracts.</text><text x="66" y="271" font-size="13">Three potentially breaking shapes.</text><text x="66" y="307" font-size="12" fill="#255a43">GitHub Actions · Daily · No model</text>
<text x="450" y="153" font-size="11" fill="#657269" letter-spacing="2">02 / MATCH</text><text x="450" y="187" font-size="21">Which routine might it affect?</text><text x="450" y="221" font-size="14">Eight routines in Maya's shop profile</text><text x="450" y="248" font-size="13">Inferred calls, recorded confidence.</text><text x="450" y="271" font-size="13">Match against the published change.</text><text x="450" y="307" font-size="12" fill="#255a43">Deterministic · No model</text>
<text x="834" y="153" font-size="11" fill="#657269" letter-spacing="2">03 / JUDGE</text><text x="834" y="187" font-size="21">What should the owner know?</text><text x="834" y="221" font-size="14">Strands on Bedrock AgentCore</text><text x="834" y="248" font-size="13">Claude Sonnet 4.5 · us-east-1</text><text x="834" y="271" font-size="13">Possible consequence + next action.</text><text x="834" y="307" font-size="12" fill="#255a43">Only eligible routines build a model</text>
<g stroke="#77927d" stroke-width="2" marker-end="url(#arrow)"><path d="M370 224H417"/><path d="M754 224H801"/><path d="M974 336V374"/><path d="M806 489H760"/><path d="M422 489H376"/></g><text x="765" y="211" font-size="10" fill="#657269">OIDC</text>
<g fill="#fffefa" stroke="#dfe5db"><rect x="44" y="388" width="322" height="210" rx="14"/><rect x="428" y="388" width="322" height="210" rx="14"/></g><rect x="812" y="388" width="324" height="210" rx="14" fill="#e8efdf" stroke="#bdcf91"/>
<text x="834" y="420" font-size="11" fill="#657269" letter-spacing="2">04 / CONTROL</text><text x="834" y="454" font-size="21">One tool can render a note.</text><text x="834" y="486" font-size="13">Stamp dates. Refuse contradictions.</text><text x="834" y="511" font-size="13">Hold repeats. Review uncertain matches.</text><text x="834" y="536" font-size="13">Keep missing or refused notes pending.</text><text x="834" y="575" font-size="12" fill="#255a43">Shared canonical controls + drift check</text>
<text x="450" y="420" font-size="11" fill="#657269" letter-spacing="2">05 / PERSIST</text><text x="450" y="454" font-size="21">The caller owns the ledger.</text><text x="450" y="486" font-size="13">Save only successfully rendered notes.</text><text x="450" y="511" font-size="13">Carry history into the next invocation.</text><text x="450" y="536" font-size="13">Commit notes, ledger and page together.</text><text x="450" y="575" font-size="12" fill="#255a43">GitHub Actions · No stored AWS keys</text>
<text x="66" y="420" font-size="11" fill="#657269" letter-spacing="2">06 / READ</text><text x="66" y="454" font-family="Georgia,serif" font-size="27">Still working.</text><text x="66" y="486" font-size="13">Or a note worth opening.</text><text x="66" y="511" font-size="13">The consequence first.</text><text x="66" y="536" font-size="13">A section to forward to Priya.</text><text x="66" y="575" font-size="12" fill="#255a43">GitHub Pages · Accessible without login</text>
<path d="M44 638H1136" stroke="#dfe5db"/><text x="44" y="677" font-family="Georgia,serif" font-size="25">56 supplier changes. Two rendered notes. That ratio is the product.</text><text x="44" y="710" font-size="13" fill="#657269">150-day historical cloud replay. Every input, decision and rendered note is available to inspect.</text><text x="44" y="734" font-size="12" fill="#657269">Human reviews are bound to the exact case. Dismissals close it without a model run.</text>
</g></svg>