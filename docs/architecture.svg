<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720"
     font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     role="img" aria-labelledby="title desc">
  <title id="title">Still Working: three layers, and only one of them needs a model</title>
  <desc id="desc">Four suppliers publish contracts. A scheduled job records what changed.
  A deterministic matcher decides which of Maya's routines that touches. Only what reaches
  a routine goes to the judgement layer on Bedrock AgentCore, where interventions decide
  whether Maya is interrupted at all.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8578"/>
    </marker>
    <marker id="arrowdark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6f4e"/>
    </marker>
    <marker id="arrowstop" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a3324"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="720" fill="#faf9f7"/>

  <text x="40" y="52" font-size="26" font-weight="650" fill="#16150f">Still Working</text>
  <text x="40" y="78" font-size="15" fill="#6b675c">Three layers. Only the third needs a model, and it is the only one deployed.</text>

  <!-- ================= LAYER 1 ================= -->
  <rect x="40" y="112" width="300" height="228" rx="14" fill="#fffefb" stroke="#e0ddd4" stroke-width="1.5"/>
  <text x="60" y="142" font-size="12" font-weight="700" fill="#6b675c" letter-spacing="1.2">1 . COLLECT</text>
  <text x="60" y="166" font-size="16" font-weight="600" fill="#16150f">What changed</text>
  <text x="60" y="188" font-size="13" fill="#6b675c">tools/snapshot.py</text>

  <rect x="60" y="204" width="120" height="26" rx="13" fill="#f2efe8"/>
  <text x="70" y="222" font-size="12.5" fill="#16150f">Stripe 589</text>
  <rect x="190" y="204" width="130" height="26" rx="13" fill="#f2efe8"/>
  <text x="200" y="222" font-size="12.5" fill="#16150f">Square 334</text>
  <rect x="60" y="238" width="120" height="26" rx="13" fill="#f2efe8"/>
  <text x="70" y="256" font-size="12.5" fill="#16150f">Xero 235</text>
  <rect x="190" y="238" width="130" height="26" rx="13" fill="#f2efe8"/>
  <text x="200" y="256" font-size="12.5" fill="#16150f">ShipEngine 97</text>

  <text x="60" y="292" font-size="12.5" fill="#6b675c">Their own published contracts,</text>
  <text x="60" y="310" font-size="12.5" fill="#6b675c">fetched every morning at 05:40 UTC.</text>
  <text x="60" y="328" font-size="12.5" font-weight="600" fill="#2f6f4e">No model. No credentials.</text>

  <!-- ================= LAYER 2 ================= -->
  <rect x="400" y="112" width="300" height="228" rx="14" fill="#fffefb" stroke="#e0ddd4" stroke-width="1.5"/>
  <text x="420" y="142" font-size="12" font-weight="700" fill="#6b675c" letter-spacing="1.2">2 . MATCH</text>
  <text x="420" y="166" font-size="16" font-weight="600" fill="#16150f">Whose problem it is</text>
  <text x="420" y="188" font-size="13" fill="#6b675c">tools/impact.py + business/maya.yaml</text>

  <rect x="420" y="206" width="260" height="64" rx="10" fill="#f2efe8"/>
  <text x="434" y="228" font-size="12.5" fill="#16150f">8 routines, in Maya's own words.</text>
  <text x="434" y="246" font-size="12.5" fill="#16150f">35 calls, derived at setup, each with</text>
  <text x="434" y="264" font-size="12.5" fill="#16150f">a confidence she has never read.</text>

  <text x="420" y="292" font-size="12.5" fill="#6b675c">Set membership. Reproducible.</text>
  <text x="420" y="310" font-size="12.5" fill="#6b675c">The same answer every single time.</text>
  <text x="420" y="328" font-size="12.5" font-weight="600" fill="#2f6f4e">No model. No credentials.</text>

  <!-- ================= LAYER 3 ================= -->
  <rect x="760" y="112" width="380" height="228" rx="14" fill="#fffefb" stroke="#2f6f4e" stroke-width="2"/>
  <text x="780" y="142" font-size="12" font-weight="700" fill="#2f6f4e" letter-spacing="1.2">3 . JUDGE</text>
  <text x="780" y="166" font-size="16" font-weight="600" fill="#16150f">Whether it actually costs her</text>
  <text x="780" y="188" font-size="13" fill="#6b675c">Strands Agents on Bedrock AgentCore Runtime</text>

  <rect x="780" y="206" width="340" height="64" rx="10" fill="#eaf3ee"/>
  <text x="794" y="228" font-size="12.5" fill="#16150f">Claude Sonnet 4.5, us-east-1.</text>
  <text x="794" y="246" font-size="12.5" fill="#16150f">Writes the note. Decides nothing about</text>
  <text x="794" y="264" font-size="12.5" fill="#16150f">whether it is sent, and holds no facts.</text>

  <text x="780" y="292" font-size="12.5" fill="#6b675c">The only layer that costs money, and the</text>
  <text x="780" y="310" font-size="12.5" fill="#6b675c">only one deployed. Consumption billed,</text>
  <text x="780" y="328" font-size="12.5" fill="#6b675c">so a quiet morning costs nothing.</text>

  <!-- flow arrows between layers -->
  <line x1="344" y1="226" x2="392" y2="226" stroke="#8a8578" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="704" y1="226" x2="752" y2="226" stroke="#2f6f4e" stroke-width="2" marker-end="url(#arrowdark)"/>

  <rect x="702" y="150" width="56" height="20" rx="10" fill="#faf9f7"/>
  <text x="710" y="165" font-size="11.5" fill="#6b675c">only if</text>

  <!-- ================= THE CONTROLS ================= -->
  <rect x="760" y="372" width="380" height="252" rx="14" fill="#fffefb" stroke="#e0ddd4" stroke-width="1.5"/>
  <text x="780" y="402" font-size="12" font-weight="700" fill="#6b675c" letter-spacing="1.2">THE CONTROLS</text>
  <text x="780" y="426" font-size="16" font-weight="600" fill="#16150f">Strands interventions, not prompt lines</text>
  <text x="780" y="448" font-size="12.5" fill="#6b675c">before_tool_call on send_to_maya</text>

  <rect x="780" y="464" width="340" height="30" rx="8" fill="#eaf3ee"/>
  <text x="794" y="484" font-size="12.5" fill="#16150f"><tspan font-weight="700">Transform</tspan>  the date and routine are stamped, never written</text>

  <rect x="780" y="500" width="340" height="30" rx="8" fill="#fbecea"/>
  <text x="794" y="520" font-size="12.5" fill="#16150f"><tspan font-weight="700">Deny</tspan>  nothing she depends on is broken</text>

  <rect x="780" y="536" width="340" height="30" rx="8" fill="#fbecea"/>
  <text x="794" y="556" font-size="12.5" fill="#16150f"><tspan font-weight="700">Deny</tspan>  she was told this same thing within five days</text>

  <rect x="780" y="572" width="340" height="30" rx="8" fill="#f6f1e4"/>
  <text x="794" y="592" font-size="12.5" fill="#16150f"><tspan font-weight="700">Confirm</tspan>  only a low confidence mapping is broken</text>

  <line x1="950" y1="344" x2="950" y2="366" stroke="#8a8578" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= WHAT MAYA GETS ================= -->
  <rect x="40" y="372" width="660" height="252" rx="14" fill="#fffefb" stroke="#e0ddd4" stroke-width="1.5"/>
  <text x="60" y="402" font-size="12" font-weight="700" fill="#6b675c" letter-spacing="1.2">WHAT MAYA GETS</text>

  <rect x="60" y="418" width="300" height="88" rx="10" fill="#eaf3ee"/>
  <text x="76" y="452" font-size="21" font-weight="650" fill="#2f6f4e">Still working.</text>
  <text x="76" y="476" font-size="13" fill="#16150f">Nothing that matters to you changed.</text>
  <text x="76" y="496" font-size="12" fill="#6b675c">148 of 150 mornings.</text>

  <rect x="380" y="418" width="300" height="88" rx="10" fill="#fbecea"/>
  <text x="396" y="452" font-size="21" font-weight="650" fill="#8a3324">Something broke.</text>
  <text x="396" y="476" font-size="13" fill="#16150f">In her words, with what it costs her,</text>
  <text x="396" y="496" font-size="12" fill="#6b675c">and a part to forward to Priya.</text>

  <text x="60" y="538" font-size="13.5" font-weight="600" fill="#16150f">150 days of real supplier history, April to September 2026</text>
  <text x="60" y="562" font-size="12.5" fill="#6b675c">56 changes across the four companies. 9 could break a caller. 7 touched a call she uses.</text>
  <text x="60" y="582" font-size="12.5" fill="#6b675c">3 broke a routine of hers. She is interrupted twice: two of them are the same thing.</text>
  <text x="60" y="606" font-size="12.5" fill="#8a3324">A tool that forwarded all 56 would have been switched off in a fortnight.</text>

  <line x1="756" y1="462" x2="708" y2="462" stroke="#8a8578" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
